<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog — WellKeptSite</title>
<meta name="description" content="Practical guides on website care plans, maintenance and redesign for small businesses."
/><link rel="canonical" href="https://wellkeptsite.com/blog/"  />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FFFFFF; --surface:#F6F5F3; --fg:#0B0B0C; --muted:#5F6169;
    --accent:#5B4FE8; --accent2:#FF6B4A; --line:rgba(11,11,12,.10); --line-strong:rgba(11,11,12,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;
    font-size:1rem;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin-inline:auto;padding-inline:clamp(1.25rem,4vw,2.5rem)}
  h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;font-weight:700}
  a{color:var(--accent);text-decoration:underline}
  header.nav{border-bottom:1px solid var(--line);padding:1.4rem 0}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--fg)}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  main{padding:clamp(2.5rem,7vh,4rem) 0}
  h1{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:.4rem}
  .updated{color:var(--muted);font-size:.9rem;margin-bottom:2.5rem}
  h2{font-size:1.15rem;margin:2.2rem 0 .7rem}
  p,li{color:var(--fg)}
  p{margin-bottom:.9rem}
  ul{margin:0 0 .9rem 1.3rem}
  li{margin-bottom:.4rem}
  table{width:100%;border-collapse:collapse;margin:.8rem 0 1.4rem;font-size:.92rem}
  th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
  .note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;
    font-size:.92rem;color:var(--muted);margin:1.8rem 0}
  footer{border-top:1px solid var(--line);padding:2rem 0;color:var(--muted);font-size:.88rem}
  .post{margin-bottom:1.6rem}.post h2{margin:.2rem 0}.post a{text-decoration:none}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="/"><span class="dot"></span>WellKeptSite</a>
    <a href="/" style="text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:600">← Back to home</a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Blog</h1>
    <p class="updated">Guides for small business owners on keeping a website fast, secure and up to date.</p>
    <!-- POSTS:START (managed by the Site Command Center; newest first) -->
    <p>Articles are coming soon.</p>
    <!-- POSTS:END -->
  </div>
</main>

<footer>
  <div class="wrap">WellKeptSite · [business mailing address]</div>
</footer>

</body>
</html>
