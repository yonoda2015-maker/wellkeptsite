<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — KILN Ceramics</title>
<meta name="description" content="Review your KILN cart — adjust quantities of your small-batch ceramics, check shipping, and head to checkout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#C9CFC4;
  --ink:#26241F;
  --clay:#A6634B;
  --card:#F4F2EC;
  --ink-soft:rgba(38,36,31,.66);
  --line:rgba(38,36,31,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400;line-height:1.12}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.site-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;max-width:1120px;margin:0 auto}
.brand{font-family:'DM Serif Display',serif;font-size:1.45rem;letter-spacing:.16em}
.nav-links{display:flex;gap:20px;align-items:center;font-size:.95rem;flex-wrap:wrap}
.nav-links a{border-bottom:2px solid transparent;padding-bottom:2px;transition:border-color .2s}
.nav-links a:hover{border-color:var(--clay)}
.cart-link{display:inline-flex;gap:7px;align-items:center}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--clay);color:var(--card);font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.38)}100%{transform:scale(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--card);border:none;font-family:'Karla',sans-serif;font-weight:700;font-size:.95rem;padding:13px 24px;border-radius:4px;cursor:pointer;transition:background .2s;text-align:center}
.btn:hover{background:var(--clay)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{color:var(--clay);border-color:var(--clay);background:none}
.page-head{padding:44px 0 26px}
.page-head h1{font-size:clamp(1.9rem,4.5vw,2.6rem)}
.page-head p{color:var(--ink-soft);margin-top:6px}
.cart-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:34px;padding-bottom:80px;align-items:start}
@media (max-width:820px){.cart-layout{grid-template-columns:1fr}}
.lines{display:flex;flex-direction:column;gap:14px}
.line{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center}
@media (max-width:520px){.line{grid-template-columns:64px 1fr}.line .line-right{grid-column:1/-1;justify-content:space-between;width:100%}}
.line .swatch-visual{width:84px;height:84px;border-radius:6px;border:1px solid var(--line)}
@media (max-width:520px){.line .swatch-visual{width:64px;height:64px}}
.g1{background:linear-gradient(150deg,#DCCFB6 0%,#B49577 55%,#8C6E52 100%)}
.g2{background:radial-gradient(circle at 32% 28%,#EDE8DA 0%,#AEB4A2 60%,#7E8676 100%)}
.g3{background:linear-gradient(160deg,#5A544B 0%,#8A7B6B 55%,#C4B49C 100%)}
.g4{background:radial-gradient(circle at 68% 30%,#D7DEDC 0%,#93A6A8 55%,#5E7476 100%)}
.g5{background:linear-gradient(140deg,#C9B8A4 0%,#A6634B 70%,#7E4736 100%)}
.g6{background:radial-gradient(circle at 40% 65%,#E9E3D2 0%,#C0BBA6 55%,#8F8C77 100%)}
.g7{background:linear-gradient(155deg,#A8B39E 0%,#77836E 55%,#4E5947 100%)}
.g8{background:radial-gradient(circle at 30% 70%,#E3D5C4 0%,#B98E70 60%,#8A5F48 100%)}
.line h2{font-size:1.1rem}
.line h2 a:hover{color:var(--clay)}
.line .variant{font-size:.83rem;color:var(--ink-soft)}
.line .unit{font-size:.83rem;color:var(--ink-soft);margin-top:2px}
.line-right{display:flex;align-items:center;gap:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.qty button{width:32px;height:38px;border:none;background:none;font-size:1rem;cursor:pointer;color:var(--ink);font-family:'Karla',sans-serif}
.qty button:hover{color:var(--clay)}
.qty input{width:38px;height:38px;border:none;background:none;text-align:center;font-family:'Karla',sans-serif;font-size:.95rem;font-weight:700;color:var(--ink)}
.qty input:focus{outline:none}
.line-total{font-weight:700;min-width:64px;text-align:right}
.remove{background:none;border:none;cursor:pointer;font-family:'Karla',sans-serif;font-size:.8rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.remove:hover{color:var(--clay)}
.summary{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;position:sticky;top:84px}
.summary h2{font-size:1.3rem;margin-bottom:16px}
.summary .row{display:flex;justify-content:space-between;font-size:.95rem;padding:7px 0}
.summary .row.muted{color:var(--ink-soft)}
.summary .row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;font-weight:700;font-size:1.05rem}
.summary .free-note{font-size:.8rem;color:var(--clay);font-weight:700;margin-top:4px}
.summary .btn{width:100%;margin-top:18px}
.summary .continue{display:block;text-align:center;font-size:.85rem;margin-top:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.summary .continue:hover{color:var(--clay)}
.empty{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:64px 28px;text-align:center;grid-column:1/-1}
.empty .bowl{width:88px;height:44px;margin:0 auto 20px;border-radius:0 0 88px 88px;background:linear-gradient(150deg,#DCCFB6,#8C6E52);position:relative}
.empty .bowl::after{content:"";position:absolute;top:0;left:8px;right:8px;height:8px;border-radius:50%;background:rgba(38,36,31,.25)}
.empty h2{font-size:1.6rem;margin-bottom:8px}
.empty p{color:var(--ink-soft);max-width:42ch;margin:0 auto 24px}
footer{border-top:1px solid var(--line);padding:34px 0 46px}
footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft)}
footer nav{display:flex;gap:18px}
footer nav a:hover{color:var(--clay)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="index.html">KILN</a>
    <div class="nav-links">
      <a href="index.html">Shop</a>
      <a href="product.html?id=ember-teapot">Featured</a>
      <a href="cart.html" class="cart-link" aria-current="page">Cart <span id="cart-badge" class="badge">0</span></a>
    </div>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Your cart</h1>
    <p id="cart-subline">Everything ships together, double-boxed.</p>
  </div>

  <div class="cart-layout" id="cart-layout">
    <section class="lines" id="cart-lines" aria-label="Cart items"></section>

    <aside class="summary" id="cart-summary" aria-label="Order summary">
      <h2>Summary</h2>
      <div class="row muted"><span id="sum-count">0 items</span><span></span></div>
      <div class="row"><span>Subtotal</span><span id="sum-subtotal">$0</span></div>
      <div class="row muted"><span>Shipping</span><span id="sum-shipping">$8</span></div>
      <p class="free-note" id="free-note" hidden>Free shipping unlocked ✓</p>
      <div class="row total"><span>Total</span><span id="sum-total">$0</span></div>
      <a class="btn" href="checkout.html" id="checkout-btn">Continue to checkout</a>
      <a class="continue" href="index.html">or keep browsing the batch</a>
    </aside>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 KILN Ceramics Studio — Eugene, OR</span>
    <nav aria-label="Footer">
      <a href="index.html">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </div>
</footer>

<script>
/* ---- KILN shared cart (identical block on every page) ---- */
const KILN_MAX_QTY = 12; /* business rule: max 12 per line item */
const KILN_PRODUCTS = {
  "ridge-mug":       { name:"Ridge Mug",           price:38,  grad:"g1", variants:["Speckled Oat","Iron Wash","Sage Ash"] },
  "dune-plate":      { name:"Dune Dinner Plate",   price:52,  grad:"g2", variants:["Speckled Oat","Sage Ash","Tide Blue"] },
  "ember-teapot":    { name:"Ember Teapot",        price:124, grad:"g3", variants:["Iron Wash","Clay Rust","Speckled Oat"] },
  "tide-bowl":       { name:"Tide Bowl",           price:44,  grad:"g4", variants:["Tide Blue","Speckled Oat","Sage Ash"] },
  "fold-vase":       { name:"Fold Vase",           price:86,  grad:"g5", variants:["Clay Rust","Iron Wash"] },
  "hearth-tumbler":  { name:"Hearth Tumbler",      price:32,  grad:"g6", variants:["Speckled Oat","Sage Ash","Clay Rust"] },
  "moss-platter":    { name:"Moss Serving Platter",price:98,  grad:"g7", variants:["Sage Ash","Iron Wash"] },
  "cinder-bud-vase": { name:"Cinder Bud Vase",     price:46,  grad:"g8", variants:["Clay Rust","Tide Blue","Speckled Oat"] }
};
const KILN_CART_KEY = "kiln_cart";
function kilnReadCart(){
  try{
    const raw = JSON.parse(localStorage.getItem(KILN_CART_KEY));
    return Array.isArray(raw) ? raw.filter(l => l && KILN_PRODUCTS[l.id] && l.qty > 0) : [];
  }catch(e){ return []; }
}
function kilnWriteCart(cart){
  localStorage.setItem(KILN_CART_KEY, JSON.stringify(cart));
  kilnUpdateBadge(true);
}
function kilnAddToCart(id, variant, qty){
  const cart = kilnReadCart();
  const line = cart.find(l => l.id === id && l.variant === variant);
  if(line){ line.qty = Math.min(KILN_MAX_QTY, line.qty + qty); }
  else{ cart.push({ id:id, variant:variant, qty:Math.min(KILN_MAX_QTY, qty) }); }
  kilnWriteCart(cart);
}
function kilnCartCount(){
  return kilnReadCart().reduce((sum, l) => sum + l.qty, 0);
}
function kilnCartSubtotal(){
  return kilnReadCart().reduce((sum, l) => sum + KILN_PRODUCTS[l.id].price * l.qty, 0);
}
function kilnUpdateBadge(bump){
  const b = document.getElementById("cart-badge");
  if(!b) return;
  b.textContent = kilnCartCount();
  if(bump){
    b.classList.remove("bump");
    void b.offsetWidth; /* restart animation */
    b.classList.add("bump");
  }
}
document.addEventListener("DOMContentLoaded", function(){ kilnUpdateBadge(false); });
/* ---- end shared cart ---- */

/* Page: cart rendering */
const FREE_SHIP_THRESHOLD = 120;
const FLAT_SHIPPING = 8;

function setLineQty(index, qty){
  const cart = kilnReadCart();
  if(!cart[index]) return;
  if(qty < 1){ cart.splice(index, 1); }
  else{ cart[index].qty = Math.min(KILN_MAX_QTY, qty); }
  kilnWriteCart(cart);
  renderCart();
}
function removeLine(index){
  const cart = kilnReadCart();
  cart.splice(index, 1);
  kilnWriteCart(cart);
  renderCart();
}

function renderCart(){
  const cart = kilnReadCart();
  const linesEl = document.getElementById("cart-lines");
  const summaryEl = document.getElementById("cart-summary");
  const subline = document.getElementById("cart-subline");
  linesEl.innerHTML = "";

  if(cart.length === 0){
    summaryEl.style.display = "none";
    subline.textContent = "Nothing here yet — the current firing is still on the shelf.";
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML =
      '<div class="bowl" aria-hidden="true"></div>' +
      '<h2>Your cart is an empty bowl</h2>' +
      '<p>Firing No. 41 just came out of the kiln — mugs, plates, and one very good teapot are waiting in the shop.</p>' +
      '<a class="btn" href="index.html">Browse the batch</a>';
    linesEl.appendChild(empty);
    return;
  }

  summaryEl.style.display = "";
  subline.textContent = "Everything ships together, double-boxed.";

  cart.forEach(function(lineData, i){
    const product = KILN_PRODUCTS[lineData.id];
    const line = document.createElement("article");
    line.className = "line";

    const visual = document.createElement("a");
    visual.className = "swatch-visual " + product.grad;
    visual.href = "product.html?id=" + lineData.id;
    visual.setAttribute("aria-label", "View " + product.name);

    const info = document.createElement("div");
    const h2 = document.createElement("h2");
    const nameLink = document.createElement("a");
    nameLink.href = "product.html?id=" + lineData.id;
    nameLink.textContent = product.name;
    h2.appendChild(nameLink);
    const variant = document.createElement("p");
    variant.className = "variant";
    variant.textContent = "Glaze: " + lineData.variant;
    const unit = document.createElement("p");
    unit.className = "unit";
    unit.textContent = "$" + product.price + " each";
    const removeBtn = document.createElement("button");
    removeBtn.className = "remove";
    removeBtn.textContent = "Remove";
    removeBtn.addEventListener("click", function(){ removeLine(i); });
    info.appendChild(h2);
    info.appendChild(variant);
    info.appendChild(unit);
    info.appendChild(removeBtn);

    const right = document.createElement("div");
    right.className = "line-right";
    const qtyBox = document.createElement("div");
    qtyBox.className = "qty";
    const minus = document.createElement("button");
    minus.type = "button";
    minus.textContent = "−";
    minus.setAttribute("aria-label", "Decrease quantity of " + product.name);
    minus.addEventListener("click", function(){ setLineQty(i, lineData.qty - 1); });
    const qtyInput = document.createElement("input");
    qtyInput.type = "number";
    qtyInput.min = "1";
    qtyInput.max = String(KILN_MAX_QTY);
    qtyInput.value = lineData.qty;
    qtyInput.setAttribute("aria-label", "Quantity of " + product.name);
    qtyInput.addEventListener("change", function(){
      let v = parseInt(qtyInput.value, 10);
      if(isNaN(v)) v = 1;
      setLineQty(i, v);
    });
    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Increase quantity of " + product.name);
    plus.addEventListener("click", function(){ setLineQty(i, lineData.qty + 1); });
    qtyBox.appendChild(minus);
    qtyBox.appendChild(qtyInput);
    qtyBox.appendChild(plus);

    const lineTotal = document.createElement("span");
    lineTotal.className = "line-total";
    lineTotal.textContent = "$" + (product.price * lineData.qty);

    right.appendChild(qtyBox);
    right.appendChild(lineTotal);

    line.appendChild(visual);
    line.appendChild(info);
    line.appendChild(right);
    linesEl.appendChild(line);
  });

  const count = kilnCartCount();
  const subtotal = kilnCartSubtotal();
  const freeShip = subtotal >= FREE_SHIP_THRESHOLD;
  const shipping = freeShip ? 0 : FLAT_SHIPPING;
  document.getElementById("sum-count").textContent = count + (count === 1 ? " item" : " items");
  document.getElementById("sum-subtotal").textContent = "$" + subtotal;
  document.getElementById("sum-shipping").textContent = freeShip ? "Free" : "$" + FLAT_SHIPPING;
  document.getElementById("free-note").hidden = !freeShip;
  document.getElementById("sum-total").textContent = "$" + (subtotal + shipping);
}

document.addEventListener("DOMContentLoaded", renderCart);
</script>
</body>
</html>
